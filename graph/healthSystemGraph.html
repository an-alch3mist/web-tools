<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Health System — Dependency Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117;
    font-family: 'JetBrains Mono', monospace;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 32px 16px;
    color: #e6edf3;
  }
  h1 { font-size: 16px; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
  p  { font-size: 10px; color: #6e7681; margin-bottom: 24px; }

  svg { display: block; }

  .node rect {
    rx: 6px;
    transition: filter .15s;
    cursor: default;
  }
  .node:hover rect { filter: brightness(1.3); }
  .node text { pointer-events: none; font-family: 'JetBrains Mono', monospace; }

  .edge { fill: none; }

  /* tooltip */
  #tip {
    position: fixed; background: #161b22;
    border: 1px solid #30363d; border-radius: 6px;
    padding: 8px 12px; font-size: 10px;
    color: #e6edf3; pointer-events: none;
    opacity: 0; transition: opacity .1s;
    max-width: 220px; line-height: 1.6; z-index: 10;
  }

  /* legend */
  #legend {
    display: flex; flex-wrap: wrap; gap: 18px;
    margin-top: 20px; justify-content: center;
  }
  .li { display: flex; align-items: center; gap: 7px; font-size: 10px; color: #8b949e; }
  .li-dot { width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid; }
</style>
</head>
<body>

<h1>Stacked Health System</h1>
<p>Dependency Graph · hover nodes</p>

<svg id="g"></svg>
<div id="tip"></div>
<div id="legend"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const C = {
  interface: { fill:"#0f2339", stroke:"#58a6ff", label:"interface" },
  impl:      { fill:"#0f2218", stroke:"#3fb950", label:"class"     },
  tester:    { fill:"#1a1130", stroke:"#bc8cff", label:"test"      },
  external:  { fill:"#231b05", stroke:"#d29922", label:"built-in"  },
};

const E = {
  implements: { color:"#58a6ff", dash:"7 3"  },
  event:      { color:"#f78166", dash:"3 3"  },
  uses:       { color:"#3fb950", dash:null   },
  contains:   { color:"#d29922", dash:null   },
};

// ── Data ──────────────────────────────────────────────────────────────────────
const nodes = [
  // row 0 — contracts
  { id:"IHealthSystem",    kind:"interface", row:0, col:1,
    tip:"All health logic — damage, heal, armor, death, events." },
  { id:"IHealthBarView",   kind:"interface", row:0, col:3,
    tip:"UI contract — OnHealthChanged + OnArmorChanged only." },

  // row 1 — implementations
  { id:"HealthSystemTester", kind:"tester", row:1, col:0,
    tip:"Play-mode harness. Calls IHealthSystem only, never EntityStats directly." },
  { id:"EntityStats",      kind:"impl",      row:1, col:1,
    tip:"Armor absorbs damage first; overflow bleeds to Health. Fires OnStatsChanged." },
  { id:"StackedHealthBar", kind:"impl",      row:1, col:3,
    tip:"Lerps red + blue fill bars. Subscribes to EntityStats.OnStatsChanged." },

  // row 2 — unity built-ins
  { id:"Image (×2)",       kind:"external",  row:2, col:2,
    tip:"UnityEngine.UI.Image — healthFill (red) + armorFill (blue)." },
  { id:"TMP_Text",         kind:"external",  row:2, col:3,
    tip:"TextMeshPro label — shows '80/100  🛡 30'." },
];

const edges = [
  { s:"EntityStats",       t:"IHealthSystem",    type:"implements", label:"implements"     },
  { s:"StackedHealthBar",  t:"IHealthBarView",   type:"implements", label:"implements"     },
  { s:"HealthSystemTester",t:"IHealthSystem",    type:"uses",       label:"uses"           },
  { s:"StackedHealthBar",  t:"EntityStats",      type:"event",      label:"OnStatsChanged" },
  { s:"StackedHealthBar",  t:"Image (×2)",       type:"contains",   label:"contains"       },
  { s:"StackedHealthBar",  t:"TMP_Text",         type:"contains",   label:"contains"       },
];

// ── Layout ────────────────────────────────────────────────────────────────────
const NW = 168, NH = 52, HGAP = 42, VGAP = 72;
const MX = 36, MY = 52;

nodes.forEach(n => {
  n.x = MX + n.col * (NW + HGAP);
  n.y = MY + n.row * (NH + VGAP);
});

const W = MX*2 + 3*(NW + HGAP) + NW;
const H = MY*2 + 2*(NH + VGAP) + NH;

const svg = d3.select("#g").attr("width", W).attr("height", H);
const byId = id => nodes.find(n => n.id === id);

// ── Row labels ────────────────────────────────────────────────────────────────
["CONTRACTS","IMPLEMENTATIONS","UNITY BUILT-INS"].forEach((lbl, i) => {
  const y = MY + i*(NH+VGAP);
  svg.append("text").attr("x", 6).attr("y", y - 8)
     .attr("fill","#3d444d").attr("font-size",8).attr("letter-spacing",2)
     .attr("font-family","JetBrains Mono, monospace").text(lbl);
  svg.append("line")
     .attr("x1",6).attr("y1",y-1).attr("x2",W-6).attr("y2",y-1)
     .attr("stroke","#21262d").attr("stroke-dasharray","4 3");
});

// ── Arrowhead defs ────────────────────────────────────────────────────────────
const defs = svg.append("defs");
Object.entries(E).forEach(([type, s]) => {
  defs.append("marker").attr("id","arr-"+type)
    .attr("viewBox","0 -4 8 8").attr("refX",8).attr("refY",0)
    .attr("markerWidth",5).attr("markerHeight",5).attr("orient","auto")
    .append("path").attr("d","M0,-4L8,0L0,4Z").attr("fill",s.color);
});

// ── Edges ─────────────────────────────────────────────────────────────────────
edges.forEach(e => {
  const s = byId(e.s), t = byId(e.t);
  const style = E[e.type];
  if (!s||!t) return;

  let x1,y1,x2,y2;
  if (s.row < t.row) {
    x1=s.x+NW/2; y1=s.y+NH; x2=t.x+NW/2; y2=t.y;
  } else if (s.row > t.row) {
    x1=s.x+NW/2; y1=s.y;    x2=t.x+NW/2; y2=t.y+NH;
  } else {
    if (s.col < t.col) { x1=s.x+NW; y1=s.y+NH/2; x2=t.x;    y2=t.y+NH/2; }
    else               { x1=s.x;    y1=s.y+NH/2; x2=t.x+NW; y2=t.y+NH/2; }
  }

  // curved path for same-row
  const sameRow = s.row === t.row;
  const d = sameRow
    ? `M${x1},${y1} C${x1+30},${y1-36} ${x2-30},${y2-36} ${x2},${y2}`
    : `M${x1},${y1} L${x2},${y2}`;

  svg.append("path").attr("class","edge").attr("d",d)
     .attr("stroke",style.color).attr("stroke-width",1.5)
     .attr("stroke-dasharray",style.dash)
     .attr("marker-end",`url(#arr-${e.type})`)
     .attr("opacity",.8);

  // edge label
  const lx=(x1+x2)/2, ly=(y1+y2)/2 - (sameRow?28:6);
  svg.append("text").attr("x",lx).attr("y",ly)
     .attr("text-anchor","middle").attr("fill",style.color)
     .attr("font-size",8).attr("opacity",.65)
     .attr("font-family","JetBrains Mono, monospace")
     .text(e.label);
});

// ── Nodes ─────────────────────────────────────────────────────────────────────
const tip = document.getElementById("tip");

const ng = svg.selectAll(".node").data(nodes).enter()
  .append("g").attr("class","node")
  .attr("transform", d=>`translate(${d.x},${d.y})`);

// glow
ng.append("rect").attr("x",-2).attr("y",-2)
  .attr("width",NW+4).attr("height",NH+4).attr("rx",8)
  .attr("fill", d=>C[d.kind].stroke).attr("opacity",.07);

// body
ng.append("rect").attr("width",NW).attr("height",NH).attr("rx",6)
  .attr("fill", d=>C[d.kind].fill)
  .attr("stroke", d=>C[d.kind].stroke).attr("stroke-width",1.5);

// kind pill
ng.append("rect").attr("x",8).attr("y",-9)
  .attr("width", d=>C[d.kind].label.length*6+10).attr("height",14).attr("rx",3)
  .attr("fill", d=>C[d.kind].fill)
  .attr("stroke", d=>C[d.kind].stroke).attr("stroke-width",1);
ng.append("text").attr("x",13).attr("y",1)
  .attr("fill", d=>C[d.kind].stroke).attr("font-size",7.5).attr("font-weight",700)
  .text(d=>C[d.kind].label);

// name
ng.append("text").attr("x",NW/2).attr("y",28)
  .attr("text-anchor","middle").attr("fill","#e6edf3")
  .attr("font-size",11).attr("font-weight",700)
  .text(d=>d.id);

// divider
ng.append("line").attr("x1",10).attr("y1",35).attr("x2",NW-10).attr("y2",35)
  .attr("stroke",d=>C[d.kind].stroke).attr("stroke-width",.4).attr("opacity",.35);

// kind label inside
ng.append("text").attr("x",NW/2).attr("y",47)
  .attr("text-anchor","middle")
  .attr("fill", d=>C[d.kind].stroke).attr("font-size",8).attr("opacity",.6)
  .text(d=>C[d.kind].label);

// hover tooltip
ng.on("mousemove",(ev,d)=>{
    tip.innerHTML=`<strong style="color:${C[d.kind].stroke}">${d.id}</strong><br>${d.tip}`;
    tip.style.opacity=1;
    tip.style.left=(ev.clientX+12)+"px";
    tip.style.top=(ev.clientY-8)+"px";
  })
  .on("mouseleave",()=>tip.style.opacity=0);

// ── Legend ────────────────────────────────────────────────────────────────────
const leg = document.getElementById("legend");

// edge types
Object.entries(E).forEach(([type,s])=>{
  const div=document.createElement("div"); div.className="li";
  const sv=document.createElementNS("http://www.w3.org/2000/svg","svg");
  sv.setAttribute("width","36"); sv.setAttribute("height","12");
  const ln=document.createElementNS("http://www.w3.org/2000/svg","line");
  ln.setAttribute("x1","0"); ln.setAttribute("y1","6"); ln.setAttribute("x2","28"); ln.setAttribute("y2","6");
  ln.setAttribute("stroke",s.color); ln.setAttribute("stroke-width","1.5");
  if(s.dash) ln.setAttribute("stroke-dasharray",s.dash);
  const ar=document.createElementNS("http://www.w3.org/2000/svg","polygon");
  ar.setAttribute("points","28,6 22,3 22,9"); ar.setAttribute("fill",s.color);
  sv.appendChild(ln); sv.appendChild(ar);
  const sp=document.createElement("span"); sp.textContent=type;
  div.appendChild(sv); div.appendChild(sp); leg.appendChild(div);
});

// separator
const sep=document.createElement("div");
sep.style.cssText="width:1px;height:16px;background:#30363d;margin:auto";
leg.appendChild(sep);

// node kinds
Object.entries(C).forEach(([k,v])=>{
  const div=document.createElement("div"); div.className="li";
  div.innerHTML=`<div class="li-dot" style="background:${v.fill};border-color:${v.stroke}"></div>${v.label}`;
  leg.appendChild(div);
});
</script>
</body>
</html>
