<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Dependency Graph Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin:0; padding:0; }

:root {
  --bg:     #0d1117;
  --panel:  #161b22;
  --border: #30363d;
  --text:   #e6edf3;
  --muted:  #8b949e;
  --dim:    #3d444d;
  --blue:   #58a6ff;
  --green:  #3fb950;
  --purple: #bc8cff;
  --amber:  #d29922;
  --red:    #f78166;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  display: grid;
  grid-template-columns: 260px 1fr;
  grid-template-rows: 48px 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ── Top bar ── */
header {
  grid-column: 1/-1;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 16px; gap: 16px;
}
header h1 { font-size: 13px; font-weight: 700; color: var(--blue); }
header span { font-size: 10px; color: var(--dim); }
.hbtns { margin-left: auto; display:flex; gap:8px; }
.hbtn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; padding: 4px 12px;
  border-radius: 5px; cursor: pointer;
  border: 1px solid var(--border);
  background: transparent; color: var(--muted);
  transition: border-color .15s, color .15s;
}
.hbtn:hover { border-color: var(--blue); color: var(--blue); }
.hbtn.danger:hover { border-color: var(--red); color: var(--red); }

/* ── Side panel ── */
aside {
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow-y: auto; padding: 12px;
  gap: 16px;
}
.section-title {
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--dim); margin-bottom: 8px;
}

/* form fields */
label { font-size: 10px; color: var(--muted); display: block; margin-bottom: 3px; }
input, select, textarea {
  width: 100%; font-family: 'JetBrains Mono', monospace;
  font-size: 11px; background: var(--bg);
  border: 1px solid var(--border); border-radius: 5px;
  color: var(--text); padding: 6px 8px; outline: none;
  transition: border-color .15s;
}
input:focus, select:focus, textarea:focus { border-color: var(--blue); }
select option { background: var(--panel); }

.field { margin-bottom: 8px; }

.btn {
  width: 100%; font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700;
  padding: 7px; border-radius: 5px; cursor: pointer;
  border: 1px solid; transition: all .15s;
}
.btn-add-node {
  border-color: var(--green); color: var(--green); background: transparent;
}
.btn-add-node:hover { background: var(--green); color: var(--bg); }
.btn-add-edge {
  border-color: var(--blue); color: var(--blue); background: transparent;
}
.btn-add-edge:hover { background: var(--blue); color: var(--bg); }

/* node list */
.node-item {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 6px; border-radius: 4px;
  background: var(--bg); border: 1px solid var(--border);
  margin-bottom: 4px; font-size: 10px;
}
.node-item .dot { width:9px; height:9px; border-radius:2px; flex-shrink:0; }
.node-item .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.node-item .del {
  cursor:pointer; color: var(--dim); font-size:12px; line-height:1;
  transition: color .1s; padding: 0 2px;
}
.node-item .del:hover { color: var(--red); }

hr { border: none; border-top: 1px solid var(--border); }

/* ── Canvas ── */
main {
  position: relative; overflow: hidden;
  background:
    radial-gradient(circle at 20% 30%, #0f1e3a 0%, transparent 60%),
    radial-gradient(circle at 80% 70%, #0f2218 0%, transparent 55%),
    var(--bg);
}
#canvas { width:100%; height:100%; }

/* ── SVG nodes / edges ── */
.gnode rect { cursor: grab; transition: filter .12s; }
.gnode rect:active { cursor: grabbing; }
.gnode:hover rect { filter: brightness(1.3); }
.gnode text { pointer-events: none; font-family: 'JetBrains Mono', monospace; }
.gedge { fill: none; }

/* ── Tooltip ── */
#tip {
  position: fixed; background: var(--panel);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 7px 11px; font-size: 10px; line-height: 1.6;
  pointer-events: none; opacity: 0; transition: opacity .1s;
  z-index: 20; max-width: 200px;
}

/* ── Empty state ── */
#empty {
  position: absolute; top:50%; left:50%;
  transform: translate(-50%,-50%);
  text-align:center; pointer-events:none;
}
#empty .big { font-size: 32px; margin-bottom: 10px; opacity:.3; }
#empty p { font-size: 11px; color: var(--dim); line-height: 1.7; }

/* ── Info bar ── */
#infobar {
  position: absolute; bottom:12px; left:50%;
  transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 20px; padding: 4px 16px;
  font-size: 9px; color: var(--dim); letter-spacing:1px;
  pointer-events: none;
}
</style>
</head>
<body>

<!-- Top bar -->
<header>
  <h1>Dependency Graph Builder</h1>
  <span>D3.js · drag nodes · hover edges</span>
  <div class="hbtns">
    <button class="hbtn" onclick="loadExample()">Load Example</button>
    <button class="hbtn" onclick="exportSVG()">Export SVG</button>
    <button class="hbtn danger" onclick="clearAll()">Clear</button>
  </div>
</header>

<!-- Side panel -->
<aside>
  <!-- Add node -->
  <div>
    <div class="section-title">Add Node</div>
    <div class="field"><label>Name</label><input id="nName" placeholder="e.g. EntityStats"/></div>
    <div class="field">
      <label>Kind</label>
      <select id="nKind">
        <option value="interface">interface</option>
        <option value="impl" selected>class</option>
        <option value="tester">test</option>
        <option value="external">built-in</option>
      </select>
    </div>
    <div class="field"><label>Note (optional)</label><input id="nNote" placeholder="short description"/></div>
    <button class="btn btn-add-node" onclick="addNode()">+ Add Node</button>
  </div>

  <hr/>

  <!-- Add edge -->
  <div>
    <div class="section-title">Add Edge</div>
    <div class="field"><label>From</label><select id="eFrom"><option value="">— select —</option></select></div>
    <div class="field"><label>To</label><select id="eTo"><option value="">— select —</option></select></div>
    <div class="field">
      <label>Relationship</label>
      <select id="eType">
        <option value="implements">implements</option>
        <option value="uses">uses</option>
        <option value="event">event</option>
        <option value="contains">contains</option>
        <option value="extends">extends</option>
        <option value="injects">injects</option>
      </select>
    </div>
    <button class="btn btn-add-edge" onclick="addEdge()">+ Add Edge</button>
  </div>

  <hr/>

  <!-- Node list -->
  <div>
    <div class="section-title">Nodes (<span id="nodeCount">0</span>)</div>
    <div id="nodeList"></div>
  </div>
</aside>

<!-- Canvas -->
<main id="mainArea">
  <svg id="canvas"></svg>
  <div id="empty">
    <div class="big">◈</div>
    <p>Add nodes from the panel<br>or click <strong>Load Example</strong></p>
  </div>
  <div id="infobar">DRAG TO REPOSITION · SCROLL TO ZOOM</div>
</main>

<div id="tip"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let nodes = [], edges = [], uid = 0;

const KINDS = {
  interface: { fill:"#0f2339", stroke:"#58a6ff", label:"interface" },
  impl:      { fill:"#0f2218", stroke:"#3fb950", label:"class"     },
  tester:    { fill:"#1a1130", stroke:"#bc8cff", label:"test"      },
  external:  { fill:"#231b05", stroke:"#d29922", label:"built-in"  },
  extends:   { fill:"#0f2339", stroke:"#58a6ff", label:"interface" }, // fallback
};

const ETYPES = {
  implements: { color:"#58a6ff", dash:"7 3"  },
  uses:       { color:"#3fb950", dash:null   },
  event:      { color:"#f78166", dash:"3 3"  },
  contains:   { color:"#d29922", dash:null   },
  extends:    { color:"#bc8cff", dash:"7 3"  },
  injects:    { color:"#79c0ff", dash:"4 4"  },
};

const NW=160, NH=50;

// ── SVG setup ─────────────────────────────────────────────────────────────────
const svg = d3.select("#canvas");
const mainEl = document.getElementById("mainArea");

// zoom container
const root = svg.append("g").attr("id","root");
svg.call(d3.zoom().scaleExtent([.2,3])
  .on("zoom", ev => root.attr("transform", ev.transform)));

// defs (arrowheads)
const defs = svg.append("defs");
function ensureMarker(type) {
  if (defs.select("#arr-"+type).size()) return;
  const c = (ETYPES[type]||ETYPES.uses).color;
  defs.append("marker").attr("id","arr-"+type)
    .attr("viewBox","0 -4 8 8").attr("refX",8).attr("refY",0)
    .attr("markerWidth",5).attr("markerHeight",5).attr("orient","auto")
    .append("path").attr("d","M0,-4L8,0L0,4Z").attr("fill",c);
}
Object.keys(ETYPES).forEach(ensureMarker);

const edgeLayer = root.append("g").attr("id","edges");
const nodeLayer = root.append("g").attr("id","gnodes");

const tip = document.getElementById("tip");

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  document.getElementById("empty").style.display = nodes.length ? "none" : "block";

  // ── edges ──
  const esel = edgeLayer.selectAll(".gedge-group").data(edges, d=>d.id);
  esel.exit().remove();
  const enter = esel.enter().append("g").attr("class","gedge-group");
  enter.append("path").attr("class","gedge");
  enter.append("text").attr("class","elabel");
  const all = enter.merge(esel);

  all.each(function(e) {
    const s = nodes.find(n=>n.id===e.s);
    const t = nodes.find(n=>n.id===e.t);
    if (!s||!t) return;
    const es = ETYPES[e.type]||ETYPES.uses;
    const g = d3.select(this);

    // attachment: connect closest sides
    const sx=s.x+NW/2, sy=s.y+NH/2, tx=t.x+NW/2, ty=t.y+NH/2;
    const dx=tx-sx, dy=ty-sy;

    let x1,y1,x2,y2;
    if (Math.abs(dx)>Math.abs(dy)) {
      x1 = dx>0 ? s.x+NW : s.x;  y1 = sy;
      x2 = dx>0 ? t.x    : t.x+NW; y2 = ty;
    } else {
      x1 = sx; y1 = dy>0 ? s.y+NH : s.y;
      x2 = tx; y2 = dy>0 ? t.y    : t.y+NH;
    }

    // slight curve
    const midX=(x1+x2)/2, midY=(y1+y2)/2;
    const offX = dy!==0 ? 20 : 0, offY = dx!==0 ? -20 : 0;
    const path = `M${x1},${y1} Q${midX+offX},${midY+offY} ${x2},${y2}`;

    g.select(".gedge")
      .attr("d", path)
      .attr("stroke", es.color).attr("stroke-width", 1.4)
      .attr("stroke-dasharray", es.dash)
      .attr("marker-end", `url(#arr-${e.type})`)
      .attr("opacity", .75);

    g.select(".elabel")
      .attr("x", midX+offX).attr("y", midY+offY - 7)
      .attr("text-anchor","middle")
      .attr("fill", es.color).attr("font-size", 8)
      .attr("font-family","JetBrains Mono, monospace").attr("opacity",.6)
      .text(e.type);
  });

  // ── nodes ──
  const nsel = nodeLayer.selectAll(".gnode").data(nodes, d=>d.id);
  nsel.exit().remove();

  const nenter = nsel.enter().append("g").attr("class","gnode")
    .attr("transform", d=>`translate(${d.x},${d.y})`)
    .call(d3.drag()
      .on("start", function(ev,d){ d3.select(this).raise(); })
      .on("drag",  function(ev,d){
        d.x+=ev.dx; d.y+=ev.dy;
        d3.select(this).attr("transform",`translate(${d.x},${d.y})`);
        render(); // re-draw edges
      })
    )
    .on("mousemove",(ev,d)=>{
      tip.innerHTML=`<span style="color:${(KINDS[d.kind]||KINDS.impl).stroke};font-weight:700">${d.name}</span>`
        +(d.note?`<br><span style="color:#8b949e">${d.note}</span>`:"");
      tip.style.opacity=1;
      tip.style.left=(ev.clientX+12)+"px";
      tip.style.top=(ev.clientY-6)+"px";
    })
    .on("mouseleave",()=>tip.style.opacity=0);

  nenter.append("rect").attr("x",-2).attr("y",-2)
    .attr("width",NW+4).attr("height",NH+4).attr("rx",8)
    .attr("fill", d=>(KINDS[d.kind]||KINDS.impl).stroke).attr("opacity",.07);
  nenter.append("rect").attr("class","body")
    .attr("width",NW).attr("height",NH).attr("rx",6);
  nenter.append("rect").attr("class","badge");
  nenter.append("text").attr("class","badgetext");
  nenter.append("text").attr("class","ntitle");
  nenter.append("text").attr("class","nkind");
  nenter.append("text").attr("class","delBtn")
    .attr("x",NW-10).attr("y",14).attr("text-anchor","middle")
    .attr("fill","#3d444d").attr("font-size",11).attr("cursor","pointer")
    .text("×")
    .on("click",(ev,d)=>{ ev.stopPropagation(); removeNode(d.id); })
    .on("mouseover",function(){ d3.select(this).attr("fill","#f78166"); })
    .on("mouseout", function(ev,d){ d3.select(this).attr("fill","#3d444d"); });

  const allN = nenter.merge(nsel);
  allN.each(function(d) {
    const k = KINDS[d.kind]||KINDS.impl;
    const g = d3.select(this);
    g.select(".body").attr("fill",k.fill).attr("stroke",k.stroke).attr("stroke-width",1.5);
    const bl = k.label.length*6+10;
    g.select(".badge").attr("x",7).attr("y",-9).attr("width",bl).attr("height",14).attr("rx",3)
      .attr("fill",k.fill).attr("stroke",k.stroke).attr("stroke-width",1);
    g.select(".badgetext").attr("x",12).attr("y",1)
      .attr("fill",k.stroke).attr("font-size",7.5).attr("font-weight",700).text(k.label);
    g.select(".ntitle").attr("x",NW/2).attr("y",26)
      .attr("text-anchor","middle").attr("fill","#e6edf3")
      .attr("font-size",11).attr("font-weight",700)
      .text(d.name.length>20 ? d.name.slice(0,18)+"…" : d.name);
    g.select(".nkind").attr("x",NW/2).attr("y",41)
      .attr("text-anchor","middle").attr("fill",k.stroke)
      .attr("font-size",8).attr("opacity",.5).text(k.label);
  });

  // update sidebar list
  const list = document.getElementById("nodeList");
  list.innerHTML = "";
  nodes.forEach(n=>{
    const k=KINDS[n.kind]||KINDS.impl;
    const div=document.createElement("div"); div.className="node-item";
    div.innerHTML=`<div class="dot" style="background:${k.stroke}"></div>
      <span class="name">${n.name}</span>
      <span class="del" onclick="removeNode('${n.id}')">×</span>`;
    list.appendChild(div);
  });
  document.getElementById("nodeCount").textContent=nodes.length;

  // refresh selects
  ["eFrom","eTo"].forEach(id=>{
    const sel=document.getElementById(id);
    const cur=sel.value;
    sel.innerHTML=`<option value="">— select —</option>`;
    nodes.forEach(n=>{ const o=document.createElement("option"); o.value=n.id; o.textContent=n.name; sel.appendChild(o); });
    sel.value=cur;
  });
}

// ── API ───────────────────────────────────────────────────────────────────────
function addNode() {
  const name=document.getElementById("nName").value.trim();
  if(!name) { flash("nName"); return; }
  const kind=document.getElementById("nKind").value;
  const note=document.getElementById("nNote").value.trim();

  // place new node in a spiral to avoid overlap
  const angle = nodes.length * 2.4;
  const r = 120 + nodes.length * 30;
  const cx = (mainEl.clientWidth-260)/2, cy = mainEl.clientHeight/2;
  nodes.push({ id:"n"+(++uid), name, kind, note,
    x: cx + r*Math.cos(angle) - NW/2,
    y: cy + r*Math.sin(angle) - NH/2 });

  document.getElementById("nName").value="";
  document.getElementById("nNote").value="";
  render();
}

function addEdge() {
  const s=document.getElementById("eFrom").value;
  const t=document.getElementById("eTo").value;
  const type=document.getElementById("eType").value;
  if(!s||!t||s===t) return;
  ensureMarker(type);
  edges.push({ id:"e"+(++uid), s, t, type });
  render();
}

function removeNode(id) {
  nodes=nodes.filter(n=>n.id!==id);
  edges=edges.filter(e=>e.s!==id&&e.t!==id);
  render();
}

function clearAll() { nodes=[]; edges=[]; render(); }

function flash(id) {
  const el=document.getElementById(id);
  el.style.borderColor="#f78166";
  setTimeout(()=>el.style.borderColor="",800);
}

// ── Example: Health System ────────────────────────────────────────────────────
function loadExample() {
  clearAll();
  const cx = (mainEl.clientWidth-260)/2, cy = mainEl.clientHeight/2;

  // manually lay out the example
  const layout = [
    { name:"IHealthSystem",    kind:"interface", x:cx-240, y:cy-140, note:"Health + Armor contract" },
    { name:"IHealthBarView",   kind:"interface", x:cx+80,  y:cy-140, note:"UI display contract"    },
    { name:"HealthSystemTester",kind:"tester",   x:cx-440, y:cy+10,  note:"Play-mode test harness" },
    { name:"EntityStats",      kind:"impl",      x:cx-190, y:cy+10,  note:"Armor → Health routing" },
    { name:"StackedHealthBar", kind:"impl",      x:cx+80,  y:cy+10,  note:"Red+Blue fill bars"     },
    { name:"Image (×2)",       kind:"external",  x:cx-50,  y:cy+170, note:"healthFill + armorFill" },
    { name:"TMP_Text",         kind:"external",  x:cx+230, y:cy+170, note:"HP / Armor label"       },
  ];
  layout.forEach(n=>{ nodes.push({id:"n"+(++uid), ...n}); });

  const idOf = name => nodes.find(n=>n.name===name)?.id;
  [
    ["EntityStats","IHealthSystem","implements"],
    ["StackedHealthBar","IHealthBarView","implements"],
    ["HealthSystemTester","IHealthSystem","uses"],
    ["StackedHealthBar","EntityStats","event"],
    ["StackedHealthBar","Image (×2)","contains"],
    ["StackedHealthBar","TMP_Text","contains"],
  ].forEach(([s,t,type])=>{
    ensureMarker(type);
    edges.push({id:"e"+(++uid), s:idOf(s), t:idOf(t), type});
  });

  render();
}

// ── Export SVG ────────────────────────────────────────────────────────────────
function exportSVG() {
  const el=document.getElementById("canvas");
  const src='<?xml version="1.0" standalone="no"?>\n'+el.outerHTML;
  const a=document.createElement("a");
  a.href="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(src);
  a.download="dependency-graph.svg"; a.click();
}

// ── Keyboard shortcut: Enter in node name ────────────────────────────────────
document.getElementById("nName").addEventListener("keydown",e=>{ if(e.key==="Enter") addNode(); });

// ── Init ──────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
