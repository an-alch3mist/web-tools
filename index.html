<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>web-tools</title>
<meta name="description" content="A minimal collection of browser tools for Unity solo dev — graph builder, markdown viewer, text utilities and more."/>

<!-- Open Graph / Discord -->
<meta property="og:type"        content="website"/>
<meta property="og:url"         content="https://an-alch3mist.github.io/web-tools/"/>
<meta property="og:title"       content="web-tools"/>
<meta property="og:description" content="Browser tools for Unity solo dev — graph builder, markdown viewer, text utilities and more."/>
<meta property="og:image"       content="https://an-alch3mist.github.io/web-tools/og.png"/>

<!-- Twitter / X -->
<meta name="twitter:card"        content="summary_large_image"/>
<meta name="twitter:url"         content="https://an-alch3mist.github.io/web-tools/"/>
<meta name="twitter:title"       content="web-tools"/>
<meta name="twitter:description" content="Browser tools for Unity solo dev — graph builder, markdown viewer, text utilities and more."/>
<meta name="twitter:image"       content="https://an-alch3mist.github.io/web-tools/og.png"/>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0d1117;
  --surface: #161b22;
  --border:  #30363d;
  --border2: #21262d;
  --text:    #e6edf3;
  --muted:   #8b949e;
  --dim:     #3d444d;
  --blue:    #58a6ff;
  --green:   #3fb950;
  --purple:  #bc8cff;
  --amber:   #d29922;
  --red:     #f78166;
  --cyan:    #79c0ff;
  --pink:    #f778ba;
  --teal:    #39d353;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(var(--border2) 1px, transparent 1px),
    linear-gradient(90deg, var(--border2) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: .3;
}
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 600px 400px at 10% 15%, #0f2339 0%, transparent 65%),
    radial-gradient(ellipse 500px 350px at 90% 80%, #0f2218 0%, transparent 65%);
}

/* ── Nav ── */
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13,17,23,.88);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border2);
  display: flex; align-items: center;
  padding: 0 20px; height: 48px; gap: 10px;
}
.logo {
  font-size: 13px; font-weight: 700; color: var(--text);
  text-decoration: none; letter-spacing: .5px;
  display: flex; align-items: center; gap: 8px;
}
.logo-mark {
  width: 24px; height: 24px; border-radius: 6px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
}
.nav-tag {
  font-size: 8px; padding: 2px 6px; border-radius: 8px;
  border: 1px solid var(--border); color: var(--dim);
  letter-spacing: 1px; text-transform: uppercase;
}
.nav-r { margin-left: auto; }
.nav-gh {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; color: var(--muted); text-decoration: none;
  border: 1px solid var(--border); border-radius: 5px;
  padding: 3px 9px; transition: border-color .15s, color .15s;
}
.nav-gh:hover { border-color: var(--blue); color: var(--blue); }
.nav-gh svg { width: 13px; height: 13px; fill: currentColor; }

/* ── Page ── */
.page { position: relative; z-index: 1; max-width: 1020px; margin: 0 auto; padding: 0 20px 72px; }

/* ── Hero ── */
.hero { padding: 48px 0 32px; }
.hero-eye { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--blue); opacity: .7; margin-bottom: 10px; }
.hero h1 { font-size: clamp(26px, 4vw, 44px); font-weight: 700; letter-spacing: -1px; line-height: 1.1; }
.hero h1 em { font-style: normal; color: var(--blue); }
.hero-sub { font-size: 11px; color: var(--muted); margin-top: 8px; }

/* ── Toolbar ── */
.toolbar { display: flex; align-items: center; gap: 8px; margin: 28px 0 16px; flex-wrap: wrap; }

.search-wrap { position: relative; }
.search-wrap input {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text);
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  padding: 7px 10px 7px 30px; width: 210px; outline: none;
  transition: border-color .15s;
}
.search-wrap input:focus { border-color: var(--blue); }
.search-wrap input::placeholder { color: var(--dim); }
.s-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 12px; pointer-events: none; }

.filter-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.ftag {
  font-size: 8.5px; padding: 3px 8px; border-radius: 9px;
  border: 1px solid var(--border); color: var(--muted);
  background: transparent; cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  transition: all .12s;
}
.ftag:hover { border-color: var(--blue); color: var(--blue); }
.ftag.active { border-color: var(--blue); color: var(--blue); background: rgba(88,166,255,.1); }

.count { margin-left: auto; font-size: 9px; color: var(--dim); white-space: nowrap; }

/* ── Grid ── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(276px, 1fr)); gap: 10px; }

/* ── Card ── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; padding: 14px 14px 12px;
  text-decoration: none; color: inherit;
  display: flex; flex-direction: column; gap: 9px;
  position: relative; overflow: hidden;
  transition: border-color .18s, transform .18s, box-shadow .18s;
  animation: fadeUp .35s ease both;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
.card::before {
  content:''; position:absolute; left:0; top:10px; bottom:10px; width:2px;
  border-radius:2px; background:var(--ac,var(--blue)); opacity:0; transition:opacity .18s;
}
.card[href]:hover { border-color:var(--ac,var(--blue)); transform:translateY(-2px); box-shadow:0 6px 24px rgba(0,0,0,.4); }
.card[href]:hover::before { opacity:1; }
.card.disabled { opacity:.42; pointer-events:none; }
.card.hidden { display:none; }

.card-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.card-left { display:flex; align-items:center; gap:8px; }
.card-icon { font-size:15px; width:26px; text-align:center; flex-shrink:0; }
.card-name { font-size:12px; font-weight:700; }
.card-path { font-size:8px; color:var(--dim); margin-top:1px; }

.badge {
  font-size:7px; text-transform:uppercase; letter-spacing:1.5px;
  padding:2px 6px; border-radius:8px; border:1px solid; flex-shrink:0; white-space:nowrap;
}
.badge-ready   { border-color:var(--green);  color:var(--green);  background:rgba(63,185,80,.08);  }
.badge-soon    { border-color:var(--amber);  color:var(--amber);  background:rgba(210,153,34,.08); }
.badge-planned { border-color:var(--dim);    color:var(--dim);    }

.card-tags { display:flex; flex-wrap:wrap; gap:4px; }
.tag {
  font-size:7.5px; padding:1px 6px; border-radius:8px;
  background:rgba(255,255,255,.04); border:1px solid var(--border2);
  color:var(--dim); cursor:pointer; transition:color .12s, border-color .12s;
}
.tag:hover { color:var(--blue); border-color:var(--blue); }

.card-arrow { position:absolute; bottom:12px; right:12px; font-size:11px; color:var(--dim); transition:color .15s, transform .15s; }
.card[href]:hover .card-arrow { color:var(--ac,var(--blue)); transform:translate(2px,-2px); }

/* ── Empty ── */
#empty { display:none; padding:40px 0; text-align:center; font-size:10px; color:var(--dim); }

/* ── Footer ── */
footer {
  border-top:1px solid var(--border2); padding:18px 20px;
  display:flex; justify-content:space-between; align-items:center;
  font-size:9px; color:var(--dim); position:relative; z-index:1; flex-wrap:wrap; gap:8px;
}
footer a { color:var(--muted); text-decoration:none; transition:color .15s; }
footer a:hover { color:var(--blue); }
.footer-links { display:flex; gap:14px; }

::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
</style>
</head>
<body>

<nav>
  <a class="logo" href="#">
    <div class="logo-mark">W</div>
    web-tools
  </a>
  <span class="nav-tag">v0.1</span>
  <div class="nav-r">
    <a class="nav-gh" href="https://github.com/an-alch3mist/web-tools" target="_blank">
      <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      GitHub
    </a>
  </div>
</nav>

<div class="page">

  <div class="hero">
    <div class="hero-eye">browser · no installs</div>
    <h1><em>web-tools</em></h1>
    <div class="hero-sub">Unity solo dev toolkit.</div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="s-icon">⌕</span>
      <input id="search" type="text" placeholder="search… ( / )" oninput="filter()"/>
    </div>
    <div class="filter-tags" id="filterTags"></div>
    <span class="count" id="count"></span>
  </div>

  <div class="grid" id="grid"></div>
  <div id="empty">no tools match</div>

</div>

<footer>
  <span>web-tools · no tracking · no ads · open source</span>
  <div class="footer-links">
    <a href="https://github.com/an-alch3mist/web-tools" target="_blank">GitHub</a>
    <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false">↑ top</a>
  </div>
</footer>

<script>
const TOOLS = [
    {
        name: "Dependency Graph",
        path: "graph/",
        icon: "◈",
        ac: "var(--blue)",
        status: "ready",
        tags: ["visualizer", "d3", "architecture", "graph", "svg", "unity"]
    },
    {
        name: "Files Combiner",
        path: "filesCombiner/csharp-to-markdown-converter.html",
        icon: "📄",
        ac: "var(--teal)",
        status: "ready",
        tags: ["viewer", "markdown", "docs"]
    },
    {
        name: "Markdown Viewer",
        path: "markdown/",
        icon: "📝",
        ac: "var(--green)",
        status: "soon",
        tags: ["viewer", "markdown", "docs", "readme", "gdd"]
    },
    {
        name: "README Viewer",
        path: "readme/",
        icon: "📖",
        ac: "var(--cyan)",
        status: "soon",
        tags: ["viewer", "readme", "markdown", "docs", "text"]
    },
    {
        name: "Decrypt Text",
        path: "decrypt/",
        icon: "🔐",
        ac: "var(--purple)",
        status: "soon",
        tags: ["text", "cipher", "base64", "xor", "encode", "decode"]
    },
    {
        name: "Color Converter",
        path: "color/",
        icon: "🎨",
        ac: "var(--amber)",
        status: "soon",
        tags: ["color", "unity", "hex", "color32", "hsv", "visualizer"]
    },
    {
        name: "Sprint Timer",
        path: "timer/",
        icon: "⏱",
        ac: "var(--teal)",
        status: "soon",
        tags: ["productivity", "pomodoro", "timer", "focus"]
    },
    {
        name: "Spritesheet Viewer",
        path: "spritesheet/",
        icon: "🖼",
        ac: "var(--pink)",
        status: "planned",
        tags: ["visualizer", "sprite", "animation", "unity", "texture"]
    },
    {
        name: "Dice & RNG",
        path: "rng/",
        icon: "🎲",
        ac: "var(--red)",
        status: "planned",
        tags: ["balance", "probability", "loot", "rng", "game-design"]
    },
    {
        name: "Stat Curve Editor",
        path: "statcurve/",
        icon: "📐",
        ac: "var(--red)",
        status: "planned",
        tags: ["balance", "curve", "xp", "level", "game-design", "unity"]
    },
    {
        name: "Scratchpad",
        path: "notes/",
        icon: "📋",
        ac: "var(--muted)",
        status: "planned",
        tags: ["text", "notes", "productivity", "quick"]
    },
];

// unique tag list — only from tags that appear across all tools
const ALL_TAGS = [...new Set(TOOLS.flatMap(t => t.tags))].sort();

// build filter pills
const ftEl = document.getElementById('filterTags');
ALL_TAGS.forEach(tag => {
  const b = document.createElement('button');
  b.className = 'ftag'; b.textContent = tag; b.dataset.tag = tag;
  b.onclick = () => { b.classList.toggle('active'); filter(); };
  ftEl.appendChild(b);
});

// build cards
const grid = document.getElementById('grid');
TOOLS.forEach((t, i) => {
  const isReady = t.status === 'ready';
  const el = document.createElement(isReady ? 'a' : 'div');
  el.className = 'card' + (isReady ? '' : ' disabled');
  el.style.setProperty('--ac', t.ac);
  el.style.animationDelay = (i * 0.04) + 's';
  if (isReady) el.href = t.path;
  el.dataset.name = t.name.toLowerCase();
  el.dataset.tags = t.tags.join(' ');

  const bc = { ready:'badge-ready', soon:'badge-soon', planned:'badge-planned' }[t.status];
  el.innerHTML = `
    <div class="card-head">
      <div class="card-left">
        <div class="card-icon">${t.icon}</div>
        <div>
          <div class="card-name">${t.name}</div>
          <div class="card-path">${t.path}</div>
        </div>
      </div>
      <span class="badge ${bc}">${t.status}</span>
    </div>
    <div class="card-tags">${t.tags.map(tag =>
      `<span class="tag" onclick="quickFilter(event,'${tag}')">${tag}</span>`
    ).join('')}</div>
    ${isReady ? '<span class="card-arrow">↗</span>' : ''}
  `;
  grid.appendChild(el);
});

function filter() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const active = [...document.querySelectorAll('.ftag.active')].map(b => b.dataset.tag);
  let n = 0;
  document.querySelectorAll('.card').forEach(c => {
    const ok = (!q || c.dataset.name.includes(q) || c.dataset.tags.includes(q))
            && (!active.length || active.every(tag => c.dataset.tags.includes(tag)));
    c.classList.toggle('hidden', !ok);
    if (ok) n++;
  });
  document.getElementById('empty').style.display = n ? 'none' : 'block';
  document.getElementById('count').textContent = `${n} / ${TOOLS.length}`;
}

function quickFilter(e, tag) {
  e.preventDefault();
  const b = [...document.querySelectorAll('.ftag')].find(b => b.dataset.tag === tag);
  if (b) { b.classList.toggle('active'); filter(); }
}

document.addEventListener('keydown', e => {
  const inp = document.getElementById('search');
  if (e.key === '/' && document.activeElement !== inp) { e.preventDefault(); inp.focus(); }
  if (e.key === 'Escape') {
    inp.value = '';
    document.querySelectorAll('.ftag.active').forEach(b => b.classList.remove('active'));
    filter();
  }
});

filter();
</script>
</body>
</html>
